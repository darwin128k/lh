name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            build_type: Release
          # Debug keeps LH_RUNTIME_ASSERT_ENABLED on, so the contract death tests
          # (LH_EXPECT_DEATH) actually run; in Release they compile but are skipped.
          - name: Linux GCC Debug
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            build_type: Debug
          # The CI runners all have AES-NI, so AES would never reach the table path;
          # turning the tier off at configure time keeps that path under the same
          # FIPS-197 / SP 800-38A known answers.
          - name: Linux GCC no AES-NI
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            build_type: Release
            cmake_args: -DLH_SIMD_HAVE_AESNI=0
          - name: Linux Clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            build_type: Release
          # No OS, atomics in the critical section: the core and rail as a board
          # without an OS sees them. rail runs on its base without an OS
          # (lh/rail/bare.h) over the CPU model; the loop is driven by passes.
          - name: Linux GCC no OS
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            build_type: Debug
            cmake_args: -DLH_LIBRARY_OPTION_OS=OFF -DLH_LIBRARY_OPTION_ATOMIC=CRITICAL
          - name: Windows MSVC
            os: windows-2025-vs2026
            build_type: Release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DLH_BUILD_DOCS=OFF
          -DLH_BUILD_TESTS=ON
          ${{ matrix.cmake_args }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build
          -DLH_BUILD_DOCS=OFF
          -DLH_BUILD_TESTS=ON
          ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Run tests
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure

  # Legacy Windows API-level builds (XP / Vista).
  #
  # These jobs run the project's batch wrappers (scripts\build-windows-xp.bat and
  # scripts\build-windows-vista.bat -> scripts\build-windows-legacy.bat), which
  # configure with -DLH_OS_WINDOWS_VERSION=0x0501 (XP) or 0x0600 (Vista)
  # and CMAKE_SYSTEM_VERSION 5.1 / 6.0, on modern windows-2025-vs2026 runners.
  #
  # They verify that the code compiles and that the tests pass against the
  # XP/Vista API level. They do NOT run anything on real Windows XP/Vista: there
  # are no GitHub-hosted XP/Vista runners. The runner's current MSVC toolset and its
  # CRT do not produce binaries that run on XP (and target Vista only in theory),
  # so the binaries built here are not XP/Vista-deployable. Real runtime
  # verification would need the v141_xp toolset (or an XP-capable MinGW) and real
  # XP/Vista VMs.
  #
  # The script defaults to the "MinGW Makefiles" generator, so we pass
  # "NMake Makefiles" plus cl explicitly; NMake comes with the MSVC environment
  # set up by msvc-dev-cmd. XP is built 32-bit (x86), Vista 64-bit (x64).
  windows-legacy:
    name: Windows legacy (${{ matrix.target }})
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: xp
            arch: x86
          - target: vista
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup MSVC environment (${{ matrix.arch }})
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.arch }}

      - name: Build and test (${{ matrix.target }})
        shell: cmd
        run: >
          call scripts\build-windows-${{ matrix.target }}.bat
          --config Release
          --generator "NMake Makefiles"
          --cc cl --cxx cl
          --no-docs --tests --run-tests

  # Cortex-M0 without an OS, build only: no atomic instructions (ATOMIC=CRITICAL),
  # no FPU (REAL=NONE), the real CPU layer under the rail base (PRIMASK, WFI).
  # Nothing runs; the library must build and need nothing beyond libgcc and
  # memcpy / memmove / memset / strlen.
  cortex-m0:
    name: Cortex-M0 (build only)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install arm-none-eabi
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi ninja-build

      - name: Configure
        run: >
          cmake -S . -B build-m0 -G Ninja
          -DCMAKE_BUILD_TYPE=MinSizeRel
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain/cortex-m0.cmake
          -DLH_LIBRARY_OPTION_OS=OFF
          -DLH_LIBRARY_OPTION_ATOMIC=CRITICAL
          -DLH_LIBRARY_OPTION_REAL=NONE
          -DLH_LIBRARY_OPTION_THREAD_LOCAL=OFF
          -DLH_POSITION_INDEPENDENT_CODE=OFF
          -DLH_BUILD_TESTS=OFF
          -DLH_BUILD_DOCS=OFF

      - name: Build
        run: cmake --build build-m0 --target lh

      - name: Needs nothing beyond libgcc and the four memory/string calls
        run: |
          arm-none-eabi-nm build-m0/liblh.a | awk '$1=="U"{print $2}' | sort -u > undefined.txt
          arm-none-eabi-nm build-m0/liblh.a | awk 'NF==3 && $2 ~ /[TDBRCW]/ {print $3}' | sort -u > defined.txt
          comm -23 undefined.txt defined.txt \
            | grep -v -E '^(__aeabi_|__gnu_thumb1_|__clzsi2$|__ctzsi2$|memcpy$|memmove$|memset$|strlen$)' \
            > outside.txt || true
          if [ -s outside.txt ]; then echo "lh needs:"; cat outside.txt; exit 1; fi
